# CI pipeline for recommendation service

name: recommendation-ci

on:
    push:
        branches: [ main ]
        paths-ignore:
        - 'README.md'
        - 'kubernetes/**'

jobs:
    build-and-code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup python
              uses: actions/setup-python@v4
              with:
                python-version: 3.12
                
            - name: Upgrade pip
              run: python -m pip install --upgrade pip setuptools wheel
            
            - name: Install Ruff (code linting and formatting tool)
              run: pipx install ruff

            - name: Lint code with Ruff
              run: ruff check --output-format=github --target-version=py39
              continue-on-error: true

            - name: Check code formatting with Ruff
              run: ruff format --diff --target-version=py39
              continue-on-error: true  
            
    docker:
        runs-on: ubuntu-latest

        needs: build-and-code-quality

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Docker
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: src/recommendation/Dockerfile
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/recommendation-service:${{ github.run_id}}

    update-k8s-manifests:
        runs-on: ubuntu-latest

        needs: docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.TOKEN }}

            - name: Update tag in Kubernetes manifests
              run: |
                  sed -i 's|image: .*|image: '"${{ secrets.DOCKERHUB_USERNAME }}"'/recommendation-service:'"${{ github.run_id }}"'|g' kubernetes/recommendation/deploy.yaml


            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add kubernetes/recommendation/deploy.yaml
                  git commit -m "[CI]: update recommendation-service image tag to ${{ github.run_id }}"
                  git push origin HEAD:main -f            