# CI for product catalog service

name: product-catalog-ci

on:
    push:
        branches: [ main ]
        paths-ignore:
        - 'README.md'
        - 'kubernetes/**'
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Go v1.22
              uses: actions/setup-go@v4 
              with:
                  go-version: 1.22

            - name: Install dependencies
              run: |
                    cd src/product-catalog
                    go mod download

            - name: Build product catalog service
              run: go build -o product-catalog src/product-catalog/main.go

            - name: Run unit tests
              run: go test ./src/product-catalog/... -v

    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Go v1.22
              uses: actions/setup-go@v4 
              with:
                  go-version: 1.22

            - name: Install golangci-lint
              run: |
                  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.59.2

            - name: Run golangci-lint
              run: golangci-lint run ./src/product-catalog/...

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Docker
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: src/product-catalog
                file: Dockerfile
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog-service:${{ github.run_id}}

    update-k8s-manifests:
        runs-on: ubuntu-latest

        needs: docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.TOKEN }}

            - name: Update tag in Kubernetes manifests
              run: |
                  sed -i 's|image: .*|image: '"${{ secrets.DOCKERHUB_USERNAME }}"'/product-catalog-service:'"${{ github.run_id }}"'|g' kubernetes/product-catalog/deploy.yaml
                  sed -i "s|image: '${{ secrets.DOCKERHUB_USERNAME }}/product-catalog-service:.*'|image: '${{ secrets.DOCKERHUB_USERNAME }}/product-catalog-service:${{ github.run_id }}'|" kubernetes/complete-deploy.yaml

            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add kubernetes/product-catalog/deploy.yaml kubernetes/complete-deploy.yaml
                  git commit -m "[CI]: update product-catalog-service image tag to ${{ github.run_id }}"
                  git push origin HEAD:main -f
              