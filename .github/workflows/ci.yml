# CI for product catalog service

name: product-catalog-ci

on:
    push:
        branches: [ main ]
        paths-ignore:
        - 'README.md'
        - 'kubernetes/**'
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Go v1.22
              uses: actions/setup-go@v4 
              with:
                  go-version: 1.22

            - name: Install dependencies and build
              run: |
                cd src/product-catalog
                go mod download
                go build -o product-catalog-service main.go

            - name: Run tests
              run: |
                cd src/product-catalog
                go test ./...

    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Go v1.22
              uses: actions/setup-go@v4 
              with:
                go-version: 1.22

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v8
              with:
                version: v2.5.0
              continue-on-error: true

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Docker
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                context: src/product-catalog
                file: src/product-catalog/Dockerfile
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog-service:${{ github.run_id}}

    update-k8s-manifests:
        runs-on: ubuntu-latest

        needs: docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.TOKEN }}

            - name: Update tag in Kubernetes manifests
              run: |
                  sed -i 's|image: .*|image: '"${{ secrets.DOCKERHUB_USERNAME }}"'/product-catalog-service:'"${{ github.run_id }}"'|g' kubernetes/productcatalog/deploy.yaml


            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add kubernetes/productcatalog/deploy.yaml
                  git commit -m "[CI]: update product-catalog-service image tag to ${{ github.run_id }}"
                  git push origin HEAD:main -f
              